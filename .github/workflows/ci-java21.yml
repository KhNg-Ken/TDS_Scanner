name: CI - Java 21 Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verify Java
        run: java -version

      - name: Set up Android SDK (install platform-tools, build-tools and platforms)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: default
          force-avd-creation: false
          emulator-options: -no-window

      - name: Confirm Android SDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          adb --version || true
          sdkmanager --list || true

      - name: Run Gradle assembleDebug
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload build outputs (artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: android/app/build/outputs/
# Note:
# - This workflow configures the runner JVM to Java 21. Building Android apps
#   on GitHub-hosted runners usually requires Android SDK components and
#   licenses to be installed. The above job attempts a straight Gradle build
#   from the `android` folder; if your project requires additional SDK setup
#   (emulator, build-tools, platform packages), add steps to install/accept
#   Android SDK packages or use an Android setup action.
